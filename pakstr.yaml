# pakstr.yaml — one file, one command, one APK.
# Generated by `pakstr init`. Edit freely.
#
# ⚠️  Keep your nsec OUT of this file. `pakstr init` wrote a local dev nsec
# to .env (gitignored). For real releases, put PAKSTR_NSEC in your CI
# secret manager — reuse the same nsec so updates install over prior APKs.
# WARNING: PAKSTR_NSEC is a production release-signing root secret. Anyone who
# has it can derive every app identity for every known appId. Losing it breaks
# update continuity. It cannot rotate the signer of an already-published app.

app:
  appId: com.routstr.chat        # REQUIRED. Java package id; also feeds key derivation.
  appName: "Routstr Chat"                  # REQUIRED. Launcher label.
  # Using auto requires a stable SemVer Git tag pointing exactly at HEAD.
  versionName: "0.3.6"           # REQUIRED. Human-readable version.
  versionCode: 1                 # REQUIRED. Monotonic integer. (auto needs a SemVer tag at HEAD; HEAD is v0.3.6, latest tag is v0.3.4)
  description: "Nostr-native AI chat with Bitcoin Lightning payments via Cashu ecash"  # OPTIONAL.
  icon: ./public/icons/icon-512.png          # OPTIONAL. Resolved relative to this file.
  splash:                          # OPTIONAL.
    image: ./public/icons/icon-512.png
    background: "#333333"
  backgroundColor: "#333333"    # OPTIONAL. Launcher icon background.
  permissions:     ["INTERNET", "NOTIFICATIONS", "VIBRATE"]   # OPTIONAL. Aliases (case-insensitive): INTERNET, CAMERA, NOTIFICATIONS, VIBRATE.

build:
  web: ./out                     # REQUIRED. Built web assets (must contain index.html). Next.js static export.
  out: ./build/com.routstr.chat.apk          # OPTIONAL. Default ./build/<appId>.apk
  builder: docker               # Only "docker" is specified.

publish:
  # Blossom upload only (no Zapstore events). Flip publish.zapstore.enabled to
  # true for a full store publish, and set a long-lived release PAKSTR_NSEC in CI.
  upload:
    enabled: true
    provider: blossom
    server: https://blossom.primal.net

  zapstore:
    enabled: false              # Set false to upload without Zapstore events.
    source: upload
    # source: https://downloads.example.com/my-app.apk  # Or an absolute public APK URL.

  relay: wss://relay.zapstore.dev
  # publishKey: PAKSTR_PUBLISH_NSEC  # OPTIONAL. Omit to reuse PAKSTR_NSEC for publishing.

  # Gitea Release alternative: replace the active Blossom upload block above
  # with this block. Keep the token itself in the environment, never this file.
  # upload:
  #   provider: gitea-release
  #   baseUrl: https://git.example.com
  #   owner: your-org
  #   repo: your-app
  #   tokenEnv: PAKSTR_GITEA_TOKEN
  #   tag: "v{versionName}"
  #   assetName: "{appId}-{versionName}.apk"
  #   prerelease: false
